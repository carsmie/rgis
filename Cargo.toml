[package]
name = "rgis"
repository = "https://github.com/carsmie/rgis"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "GPL-2.0-or-later"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.22.1"
crs-definitions = "0.6.0"
flatgeobuf = { version = "6.0.1", default-features = false }
gdal-sys = { version = "0.12.0", optional = true, features = ["bindgen"] }
geo-types = "0.7.20"
geozero = { version = "0.15.1", features = ["with-wkb", "with-geo"] }
harfrust = "0.12.0"
hmac = "0.13.0"
httpdate = "1.0.3"
indexmap = "2.14.2"
parking_lot = "0.12.5"
png = "0.18.1"
proj4rs = "0.2.1"
reqwest = { version = "0.12", default-features = false, features = ["default-tls"] }
resvg = "0.48.1"
roxmltree = "0.21.1"
rustc-hash = "2.1.3"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
shapefile = { version = "0.9.0", features = ["geo-types"] }
skrifa = "0.44.0"
thiserror = "2.0.21"
tiny-skia = "0.12.0"
tokio = { version = "1.53.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
urlencoding = "2.1.3"
wkt = "0.14"
zip = "9.0.4"
tokio-postgres = { version = "0.7.18", default-features = false, features = ["runtime"] }

[features]
default = ["raster"]
# Raster layers through GDAL (the library QGIS itself uses). Without it rGIS is pure Rust
# and skips raster layers.
raster = ["dep:gdal-sys"]
